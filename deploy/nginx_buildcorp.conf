server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10M;

    access_log /var/log/nginx/buildcorp_access.log;
    error_log  /var/log/nginx/buildcorp_error.log;

    # Archivos estáticos (CSS, JS, admin) los entrega Nginx directamente
    location /static/ {
        alias __APP_DIR__/staticfiles/;
    }

    # Todo lo demás va a Gunicorn por el socket unix (proxy inverso)
    location / {
        include proxy_params;
        proxy_pass http://unix:__SOCK__;
    }
}
