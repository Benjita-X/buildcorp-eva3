# ETAPA 6 de la receta: Nginx como proxy inverso.
# Se copia a /etc/nginx/sites-available/buildcorp.
#   - listen 80: recibe las visitas web.
#   - location /static/: Nginx entrega directo los CSS y JS (generados con collectstatic).
#   - location /: todo lo demás se lo pasa a Gunicorn por el socket.
server {
    listen 80;
    server_name 16.59.68.35;

    access_log /var/log/nginx/buildcorp_access.log;
    error_log /var/log/nginx/buildcorp_error.log;

    location /static/ {
        alias /home/ubuntu/apps/buildcorp/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/apps/buildcorp.sock;
    }
}
